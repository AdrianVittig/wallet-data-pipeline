name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallet_pipeline
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: wallet_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet_pipeline -d wallet_analytics_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ANALYTICS_DB_HOST: localhost
      ANALYTICS_DB_PORT: 5432
      ANALYTICS_DB_NAME: wallet_analytics_test
      ANALYTICS_DB_USER: wallet_pipeline
      ANALYTICS_DB_PASSWORD: ci_test_password
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: wallet_analytics_test
      PGUSER: wallet_pipeline
      PGPASSWORD: ci_test_password

    steps:
      - name: Get project files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Create database schema
        run: |
          for script in sql/0*_*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$script"
          done

      - name: Run tests
        run: python -m pytest -v